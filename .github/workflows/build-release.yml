name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2'

    - name: Setup OpenSSL
      run: |
        choco install openssl -y
        echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

    - name: Configure
      run: cmake -B build -S . -G "Visual Studio 18 2026" -A x64

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Create installer package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release-package | Out-Null
        foreach ($name in @('EmailViewer', 'MarkdownViewer', 'PrettyViewer', 'SshClient')) {
          Copy-Item "build\plugins\$name\Release\$name.dll" "release-package\$name.dll"
        }
        @'
        @echo off
        setlocal enabledelayedexpansion
        set "INSTALL_DIR=C:\Program Files\Far Manager\Plugins"
        net session >nul 2>&1
        if %errorlevel% neq 0 (
            echo Requesting administrator privileges...
            powershell -Command "Start-Process '%~f0' -Verb RunAs"
            exit /b
        )
        for %%p in (EmailViewer MarkdownViewer PrettyViewer SshClient) do (
            set "DEST_DIR=%INSTALL_DIR%\%%p"
            if not exist "!DEST_DIR!" mkdir "!DEST_DIR!"
            copy /y "%~dp0%%p.dll" "!DEST_DIR!\" >nul
            if errorlevel 1 (echo [FAIL] %%p) else (echo [OK] %%p)
        )
        echo Done.
        pause
        '@ | Set-Content -Encoding ascii release-package\install.bat

    - name: Create ZIP archive
      run: |
        cd release-package
        7z a ../far-plugins.zip *
        cd ..

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: far-plugins.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: far-plugins
        path: release-package/
