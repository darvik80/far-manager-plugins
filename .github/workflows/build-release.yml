name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.20'

    - name: Setup OpenSSL
      run: |
        choco install openssl -y
        echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

    - name: Configure
      run: |
        cmake -B build -S . -A x64

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Create installer package
      run: |
        mkdir release-package
        copy build\plugins\EmailViewer\Release\EmailViewer.dll release-package\
        copy build\plugins\MarkdownViewer\Release\MarkdownViewer.dll release-package\
        copy build\plugins\SshClient\Release\SshClient.dll release-package\

        @echo off
        (
          echo @echo off
          echo setlocal enabledelayedexpansion
          echo.
          echo set "INSTALL_DIR=C:\Program Files\Far Manager\Plugins"
          echo.
          echo net session ^>nul 2^>^&1
          echo if %%errorlevel%% neq 0 ^(
          echo     echo Requesting administrator privileges...
          echo     powershell -Command "Start-Process '%%~f0' -Verb RunAs"
          echo     exit /b
          echo ^)
          echo.
          echo for %%%%p in ^(EmailViewer MarkdownViewer SshClient^) do ^(
          echo     set "DEST_DIR=%%INSTALL_DIR%%\%%%%p"
          echo     if not exist "%%DEST_DIR%%" mkdir "%%DEST_DIR%%"
          echo     copy /y "%%~dp0%%%%p.dll" "%%DEST_DIR%%\" ^>nul
          echo     if %%errorlevel%% equ 0 ^(
          echo         echo [OK]   %%%%p
          echo     ^) else ^(
          echo         echo [FAIL] %%%%p
          echo     ^)
          echo ^)
          echo.
          echo echo Done.
          echo pause
        ) > release-package\install.bat

    - name: Create ZIP archive
      run: |
        cd release-package
        7z a ../far-plugins.zip *
        cd ..

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: far-plugins.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: far-plugins
        path: release-package/
